name: orialis-hermes
label: Orialis
kind: platform
version: 1.0.0
description: >
  Agent Gateway adapter connecting Hermes to an Orialis Server over WebSocket.
  This bridge preserves the v1 message, attachment, ACK, reconnect, and device
  authentication contract, and negotiates non-voice typing, streaming, agent/tool
  state, clarify, approval, slash commands, delivery, sessions, and artifacts.
  Voice, STT, and TTS are intentionally not supported. Exposes authenticated,
  validated tools for the complete user-domain HTTP API currently provided by
  the server (tasks, projects, milestones, schedules/calendar events,
  conversations, and messages).
author: Orialis
provides_tools:
  - create_messages
  - create_conversations
  - create_milestones
  - create_projects
  - create_tasks
  - create_calendar_events
  - create_schedules
  - orialis_capabilities
  - news.publish
  - list_tasks
  - create_task
  - update_task
  - delete_task
  - list_projects
  - create_project
  - update_project
  - delete_project
  - get_project_summary
  - list_milestones
  - create_milestone
  - get_milestone
  - update_milestone
  - delete_milestone
  - list_schedules
  - create_schedule
  - get_schedule
  - update_schedule
  - delete_schedule
  - list_calendar_events
  - create_calendar_event
  - get_calendar_event
  - update_calendar_event
  - delete_calendar_event
  - list_conversations
  - create_conversation
  - update_conversation
  - delete_conversation
  - list_messages
  - create_message
requires_env:
  - name: ORIALIS_SERVER_URL
    description: "Orialis Agent Gateway WebSocket URL (for example ws://127.0.0.1:18443/api/v1/agent/ws)"
    prompt: "Orialis Server WebSocket URL"
    password: false
  - name: ORIALIS_DEVICE_ID
    description: "Stable ID in <USER>_<DEVICE>_<Agent> form, for example JXCZ_MBA_Hermes"
    prompt: "Orialis device ID"
    password: false
optional_env:
  - name: ORIALIS_ALLOWED_USERS
    description: "Sender allowlist; set to this gateway ORIALIS_DEVICE_ID for authenticated Orialis chat"
    prompt: "Allowed Orialis sender (this device ID)"
    password: false
  - name: ORIALIS_DEVICE_TOKEN
    description: "Account-bound Orialis Agent bearer token; required for user-domain HTTP tools and Agent authentication"
    prompt: "Orialis device token (or empty)"
    password: true
  - name: ORIALIS_NEWS_PUBLISHER_TOKEN
    description: "Separate account-bound news publisher bearer token, required for news.publish"
    prompt: "Orialis news publisher token (or empty)"
    password: true
  - name: ORIALIS_HOME_CHANNEL
    description: "Conversation ID used by standalone Hermes cron delivery"
    prompt: "Orialis home channel (or empty)"
    password: false
