name: orialis_mobile
description: Orialis local-first mobile client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  dio: ^5.8.0+1
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
