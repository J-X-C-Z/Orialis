name: Orialis checks

on:
  push:
    branches:
      - main
      - refactor/repository-health-20261004
      - refactor/repository-health-20261004/**
      - health-20261004/**
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-contracts.txt
      - run: python scripts/validate-contracts.py
      - run: python -m py_compile integrations/hermes/orialis/*.py
      # These tests do not require the proprietary Hermes runtime.
      - run: python -m unittest integrations.hermes.orialis.tests.test_protocol integrations.hermes.orialis.tests.test_tools
      - run: python -m pytest -q integrations/hermes/orialis/tests/test_contract_fixtures.py
      # Run the complete plugin discovery when the Hermes runtime is available;
      # the public CI image cannot install that proprietary dependency.
      - name: Hermes runtime discovery
        run: |
          if python -c 'import gateway' >/dev/null 2>&1; then
            PYTHONPATH=. python -m unittest discover -s integrations/hermes/orialis -t . -p 'test_*.py'
          else
            echo "::notice::Hermes gateway package unavailable; full runtime discovery is deferred to scripts/validate-hermes-plugin.sh"
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: Capture Clippy diagnostics
        run: python3 scripts/repo_health/clippy_diagnostics.py capture --output "$RUNNER_TEMP/clippy-candidate.jsonl"
      - name: Reject new Clippy diagnostics
        run: >-
          python3 scripts/repo_health/clippy_diagnostics.py compare
          --baseline .github/repo-health/clippy-baseline.json
          --candidate "$RUNNER_TEMP/clippy-candidate.jsonl"
          --baseline-sha c5d04460df3adf2ffb71ede6530a1c5af85c6dcc
          --candidate-sha "$GITHUB_SHA"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter test

  macos-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter build macos --debug --target lib/main_desktop.dart

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run build

  vela:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band/vela/package-lock.json
      - working-directory: band/vela
        run: npm ci
      - working-directory: band/vela
        run: npm test
      - working-directory: band/vela
        run: npm run build

  lumina-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: packages/lumina_ui
        run: flutter pub get
      - working-directory: packages/lumina_ui
        run: flutter test
      - working-directory: packages/lumina_ui
        run: flutter analyze lib test
      - working-directory: packages/lumina_ui/example
        run: flutter pub get
      - working-directory: packages/lumina_ui/example
        run: flutter test
      - run: python3 packages/lumina_tokens/generate_flutter.py --check

  lumina-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/lumina_web/package-lock.json
      - working-directory: packages/lumina_web
        run: npm ci
      - working-directory: packages/lumina_web
        run: npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed commits for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          require_commit() {
            local sha="$1"
            git cat-file -e "${sha}^{commit}" 2>/dev/null || {
              echo "::error::Commit object is unavailable: ${sha}"
              return 1
            }
          }

          python3 -m unittest scripts.repo_health.tests.test_gates

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(jq -r '.pull_request.base.sha // empty' "$EVENT_PATH")"
            head="$(jq -r '.pull_request.head.sha // empty' "$EVENT_PATH")"
            [[ -n "$base" && -n "$head" ]] || {
              echo "::error::Pull request event is missing base/head SHA"
              exit 1
            }
            require_commit "$base"
            require_commit "$head"
            git diff --check "${base}...${head}"
            python3 scripts/repo_health/check_changed_artifacts.py --base "$base" --head "$head" --three-dot
          elif [[ "$EVENT_NAME" == "push" ]]; then
            before="$(jq -r '.before // empty' "$EVENT_PATH")"
            after="$(jq -r '.after // empty' "$EVENT_PATH")"
            [[ -n "$before" && -n "$after" ]] || {
              echo "::error::Push event is missing before/after SHA"
              exit 1
            }
            [[ "$after" == "$EVENT_SHA" ]] || {
              echo "::error::Push after SHA does not match the event SHA"
              exit 1
            }
            require_commit "$after"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git hash-object -t tree /dev/null)"
            else
              if ! require_commit "$before"; then
                git fetch --no-tags --depth=1 origin "$before"
                require_commit "$before"
              fi
            fi
            git diff --check "$before" "$after"
            python3 scripts/repo_health/check_changed_artifacts.py --base "$before" --head "$after"
          else
            echo "::error::Unsupported event: $EVENT_NAME"
            exit 1
          fi
