name: Orialis checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-contracts.txt
      - run: python scripts/validate-contracts.py
      - run: python -m py_compile integrations/hermes/orialis/*.py
      # These tests do not require the proprietary Hermes runtime.
      - run: python -m unittest integrations.hermes.orialis.tests.test_protocol integrations.hermes.orialis.tests.test_tools
      - run: python -m pytest -q integrations/hermes/orialis/tests/test_contract_fixtures.py
      # Run the complete plugin discovery when the Hermes runtime is available;
      # the public CI image cannot install that proprietary dependency.
      - name: Hermes runtime discovery
        run: |
          if python -c 'import gateway' >/dev/null 2>&1; then
            PYTHONPATH=. python -m unittest discover -s integrations/hermes/orialis -t . -p 'test_*.py'
          else
            echo "::notice::Hermes gateway package unavailable; full runtime discovery is deferred to scripts/validate-hermes-plugin.sh"
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      # Baseline currently contains pre-existing dead-code/clippy findings in
      # server test modules; keep the command visible while it is remediated.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        continue-on-error: true

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter test

  macos-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/bootstrap-macos.sh
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter build macos --debug

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
