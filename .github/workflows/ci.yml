name: Orialis checks

on:
  push:
    branches:
      - main
      - refactor/repository-health-20261004
      - refactor/repository-health-20261004/**
      - health-20261004/**
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      contracts: ${{ steps.select.outputs.contracts }}
      python: ${{ steps.select.outputs.python }}
      mobile: ${{ steps.select.outputs.mobile }}
      macos_client: ${{ steps.select.outputs.macos_client }}
      website: ${{ steps.select.outputs.website }}
      vela: ${{ steps.select.outputs.vela }}
      lumina_flutter: ${{ steps.select.outputs.lumina_flutter }}
      lumina_web: ${{ steps.select.outputs.lumina_web }}
      workflow: ${{ steps.select.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select component checks for this event range
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/repo_health/select_ci_jobs.py
          --event "$EVENT_PATH" --event-name "$EVENT_NAME" --event-sha "$EVENT_SHA"

  python:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - run: python -m pip install -r scripts/requirements-contracts.txt -r integrations/codex_gateway/requirements.txt
      - run: python scripts/validate-contracts.py
      - run: python -m compileall -q integrations/hermes/orialis integrations/news integrations/codex_gateway integrations/orialis_sdk scripts tests
      # These tests do not require the proprietary Hermes runtime.
      - run: python -m unittest integrations.hermes.orialis.tests.test_protocol integrations.hermes.orialis.tests.test_tools integrations.hermes.orialis.tests.test_batch_tools
      - run: >-
          python -m pytest -q
          integrations/hermes/orialis/tests/test_contract_fixtures.py
          integrations/news/tests
          integrations/codex_gateway/test_gateway.py
          integrations/orialis_sdk/tests
      - run: >-
          python -m pytest -q
          tests/news_sources
          tests/roadmap/test_static_contracts.py
          scripts/repo_health/tests
      # Run the complete plugin discovery when the Hermes runtime is available;
      # the public CI image cannot install that proprietary dependency.
      - name: Hermes runtime discovery (explicitly deferred when unavailable)
        id: hermes_runtime
        run: |
          if python -c 'import gateway' >/dev/null 2>&1; then
            PYTHONPATH=. python -m unittest discover -s integrations/hermes/orialis -t . -p 'test_*.py'
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=deferred" >> "$GITHUB_OUTPUT"
            {
              echo '### Hermes runtime discovery: DEFERRED'
              echo 'The proprietary gateway package is unavailable on this runner. This is not a passing runtime test.'
              echo 'Owner: plugin team (7c62159b-d540-4a58-a083-ebb0a3fec96d). Closure: run scripts/validate-hermes-plugin.sh in the supported isolated Hermes environment and have T13 verify the SHA and outcome.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::DEFERRED, not passed: Hermes gateway package unavailable; owner and closure are recorded in the workflow summary and docs/repo-health-ci-matrix.md"
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --locked --release -p orialis-server
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - name: Capture Clippy diagnostics
        run: python3 scripts/repo_health/clippy_diagnostics.py capture --output "$RUNNER_TEMP/clippy-candidate.jsonl"
      - name: Reject new Clippy diagnostics
        run: >-
          python3 scripts/repo_health/clippy_diagnostics.py compare
          --baseline .github/repo-health/clippy-baseline.json
          --candidate "$RUNNER_TEMP/clippy-candidate.jsonl"
          --baseline-sha c5d04460df3adf2ffb71ede6530a1c5af85c6dcc
          --candidate-sha "$GITHUB_SHA"
      - name: Check historical migration checksums
        run: |
          reference_root="$RUNNER_TEMP/migration-reference"
          mkdir -p "$reference_root"
          git archive c5d04460df3adf2ffb71ede6530a1c5af85c6dcc orialis-server/migrations \
            | tar -x -C "$reference_root"
          python3 scripts/check-migration-checksums.py \
            --reference-dir "$reference_root/orialis-server/migrations"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - run: python -m pip install -r integrations/codex_gateway/requirements.txt
      - name: Run root black-box tests against a disposable SQLite service
        run: python3 scripts/roadmap-e2e/run.py --start-server --skip-rust

  headless:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm headless port is available
        run: |
          if ss -ltn '( sport = :18443 )' | grep -q LISTEN; then
            echo '::error::127.0.0.1:18443 is already in use'
            exit 1
          fi
      - name: Prepare disposable data directory for the container user
        run: |
          mkdir -p runtime-data
          sudo chown 10001:10001 runtime-data
      - name: Run Linux Docker headless acceptance script
        run: sudo scripts/platform/linux-headless-check.sh
      - name: Record image and verify SQLite database was created
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' orialis-server:headless-local)"
          test -n "$image_id"
          sudo test -f runtime-data/orialis.db
          {
            echo '### Linux headless acceptance'
            echo "- Image: `orialis-server:headless-local`"
            echo "- Image ID: `$image_id`"
            echo '- SQLite database: `runtime-data/orialis.db` exists'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restart headless service and verify health and filesystem policy
        run: |
          set -euo pipefail
          docker compose -f compose.headless.yaml up -d
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18443/api/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          uid="$(docker compose -f compose.headless.yaml exec -T orialis-server sh -c 'id -u')"
          test "$uid" = 10001
          docker compose -f compose.headless.yaml exec -T orialis-server sh -c 'test ! -w /etc && test -w /data && test -w /tmp'
          sudo test -f runtime-data/orialis.db
          echo 'Second start reused runtime-data/orialis.db and passed health, UID, and filesystem checks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Capture logs and cleanly stop headless service
        if: always()
        run: |
          docker compose -f compose.headless.yaml logs --no-color --tail=200 || true
          docker compose -f compose.headless.yaml down

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter test
      - working-directory: mobile
        run: flutter build apk --debug

  macos-client:
    needs: changes
    if: needs.changes.outputs.macos_client == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter build macos --debug --target lib/main_desktop.dart

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Record Node and npm versions
        run: node --version && npm --version
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run build

  vela:
    needs: changes
    if: needs.changes.outputs.vela == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: band/vela/package-lock.json
      - name: Record Node and npm versions
        run: node --version && npm --version
      - working-directory: band/vela
        run: npm ci
      - working-directory: band/vela
        run: npm test
      - working-directory: band/vela
        run: npm run build

  lumina-flutter:
    needs: changes
    if: needs.changes.outputs.lumina_flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - working-directory: packages/lumina_ui
        run: flutter pub get
      - working-directory: packages/lumina_ui
        run: flutter analyze lib test
      - working-directory: packages/lumina_ui
        run: flutter test
      - working-directory: packages/lumina_ui/example
        run: flutter pub get
      - working-directory: packages/lumina_ui/example
        run: flutter test
      - run: python3 packages/lumina_tokens/generate_flutter.py --check

  lumina-web:
    needs: changes
    if: needs.changes.outputs.lumina_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: packages/lumina_web/package-lock.json
      - name: Record Node and npm versions
        run: node --version && npm --version
      - working-directory: packages/lumina_web
        run: npm ci
      - working-directory: packages/lumina_web
        run: npm run build

  hygiene:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed commits for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          require_commit() {
            local sha="$1"
            git cat-file -e "${sha}^{commit}" 2>/dev/null || {
              echo "::error::Commit object is unavailable: ${sha}"
              return 1
            }
          }

          python3 -m unittest scripts.repo_health.tests.test_gates

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(jq -r '.pull_request.base.sha // empty' "$EVENT_PATH")"
            head="$(jq -r '.pull_request.head.sha // empty' "$EVENT_PATH")"
            [[ -n "$base" && -n "$head" ]] || {
              echo "::error::Pull request event is missing base/head SHA"
              exit 1
            }
            require_commit "$base"
            require_commit "$head"
            git diff --check "${base}...${head}"
            python3 scripts/repo_health/check_changed_artifacts.py --base "$base" --head "$head" --three-dot
          elif [[ "$EVENT_NAME" == "push" ]]; then
            before="$(jq -r '.before // empty' "$EVENT_PATH")"
            after="$(jq -r '.after // empty' "$EVENT_PATH")"
            [[ -n "$before" && -n "$after" ]] || {
              echo "::error::Push event is missing before/after SHA"
              exit 1
            }
            [[ "$after" == "$EVENT_SHA" ]] || {
              echo "::error::Push after SHA does not match the event SHA"
              exit 1
            }
            require_commit "$after"
            artifact_base="$before"
            if [[ "$before" =~ ^0+$ ]]; then
              empty_tree="$(git hash-object -t tree /dev/null)"
              # A first push has no previous ref. Keep whitespace hygiene strict
              # across the full tree, but scope artifact checks to changes from
              # the repository's integration branch so existing large assets
              # are not misclassified as newly introduced blobs.
              git diff --check "$empty_tree" "$after"
              integration_ref="origin/refactor/repository-health-20261004"
              require_commit "$integration_ref"
              artifact_base="$(git merge-base "$after" "$integration_ref")"
              [[ -n "$artifact_base" ]] || {
                echo "::error::Could not determine artifact baseline against $integration_ref"
                exit 1
              }
            else
              if ! require_commit "$before"; then
                git fetch --no-tags --depth=1 origin "$before"
                require_commit "$before"
              fi
              git diff --check "$before" "$after"
            fi
            python3 scripts/repo_health/check_changed_artifacts.py --base "$artifact_base" --head "$after"
          else
            echo "::error::Unsupported event: $EVENT_NAME"
            exit 1
          fi
