[package]
name = "oris-server"
version = "0.1.0"
edition = "2021"
description = "Oris foundation API server"
license = "UNLICENSED"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
oris-core = { path = "../oris-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrypt = "0.11"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
